# Releases the framework on every merge into main: tests, packs, publishes to nuget.org, then tags and creates
# the GitHub release. The version comes from Directory.Build.props; bump it on devel before merging into main.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two releases at once, and never cancel one halfway through a publish.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write   # create the tag and the GitHub release
  id-token: write   # nuget.org Trusted Publishing (OIDC)

jobs:
  release:
    # A manual run from any other branch must not publish.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Read the version
        id: version
        run: |
          version=$(dotnet msbuild Kernel/Kernel.csproj -getProperty:Version)
          echo "Version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # A merge without a version bump must not publish twice.
      - name: Fail if the tag already exists
        run: |
          tag="v${{ steps.version.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "::error::Tag $tag already exists. Bump <Version> in Directory.Build.props on devel first."
            exit 1
          fi

      - name: Build
        run: dotnet build SimulaSharp.slnx -c Release

      - name: Test Kernel
        run: dotnet test Kernel.Tests/Kernel.Tests.csproj -c Release

      - name: Test CodeGen
        run: dotnet test CodeGen.Tests/CodeGen.Tests.csproj -c Release

      - name: Test Hosting
        run: dotnet test Hosting.Tests/Hosting.Tests.csproj -c Release

      - name: Pack
        run: pwsh -File pack.ps1 -Output artifacts

      # Trusted Publishing: trades the job's OIDC token for a nuget.org API key valid for one hour.
      - name: NuGet login
        id: nuget
        uses: NuGet/login@v1
        with:
          user: andreas_michelis

      # Published before the tag, so a failed run can simply be re-run; --skip-duplicate makes that safe.
      # The matching .snupkg symbol packages are pushed along with each .nupkg.
      - name: Push to nuget.org
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Tag and create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "v${{ steps.version.outputs.version }}"
          artifacts/*.nupkg artifacts/*.snupkg
          --target "$GITHUB_SHA"
          --title "v${{ steps.version.outputs.version }}"
          --generate-notes
